name: Update stock data

on:
  schedule:
    # 3 times a day on weekdays (UTC)
    - cron: "0 14,17,20 * * 1-5"
  workflow_dispatch: # allows running it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch quotes from Alpha Vantage
        run: node scripts/fetch-quotes.js
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      - name: Commit data.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update stock data" && git push)
