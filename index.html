<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>לוח מניות</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --panel: #131a2b;
      --border: #24304d;
      --text: #e8ecf7;
      --muted: #8c98b5;
      --up: #39ff88;
      --down: #ff3d5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      padding: 32px 16px;
    }
    main { max-width: 820px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .updated { color: var(--muted); margin: 0 0 20px; }
    .banner {
      background: #2a2410;
      border: 1px solid #6b5a1a;
      color: #ffd866;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .error { color: var(--down); }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    th, td { padding: 14px 16px; text-align: right; }
    th { color: var(--muted); font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--border); }
    tbody tr + tr td { border-top: 1px solid var(--border); }
    .num { direction: ltr; unicode-bidi: isolate; display: inline-block; }
    .symbol { font-weight: 700; letter-spacing: 0.5px; }
    .up { color: var(--up); text-shadow: 0 0 10px rgba(57, 255, 136, 0.7); }
    .down { color: var(--down); text-shadow: 0 0 10px rgba(255, 61, 90, 0.7); }
    .date { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>לוח מניות</h1>
    <p class="updated" id="updated">טוען נתונים...</p>
    <div class="banner" id="banner" hidden>אלו נתוני דוגמה. הנתונים האמיתיים יופיעו אחרי ההרצה הראשונה של העדכון האוטומטי.</div>
    <table>
      <thead>
        <tr>
          <th>סימול</th>
          <th>מחיר אחרון</th>
          <th>שינוי ביום</th>
          <th>תאריך עדכון</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>

  <script>
    const formatPrice = (value) => value.toFixed(2);

    function formatChange(quote) {
      const up = quote.change >= 0;
      const arrow = up ? "▲" : "▼";
      const sign = up ? "+" : "-";
      const amount = Math.abs(quote.change).toFixed(2);
      const percent = Math.abs(quote.changePercent).toFixed(2);
      return { className: up ? "up" : "down", text: `${arrow} ${sign}${amount} (${sign}${percent}%)` };
    }

    function render(data) {
      document.getElementById("banner").hidden = !data.isSample;
      document.getElementById("updated").textContent = data.updatedAt
        ? "עודכן לאחרונה: " + new Date(data.updatedAt).toLocaleString("he-IL")
        : "עדכון אחרון: עדיין לא בוצע עדכון";

      const rows = document.getElementById("rows");
      rows.innerHTML = "";
      for (const quote of data.quotes) {
        const change = formatChange(quote);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="symbol"><span class="num">${quote.symbol}</span></td>
          <td><span class="num">${formatPrice(quote.price)}</span></td>
          <td class="${change.className}"><span class="num">${change.text}</span></td>
          <td class="date"><span class="num">${quote.tradingDay}</span></td>`;
        rows.appendChild(tr);
      }
    }

    fetch("data.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      })
      .then(render)
      .catch(() => {
        const updated = document.getElementById("updated");
        updated.textContent = "לא הצלחנו לטעון את הנתונים.";
        updated.classList.add("error");
      });
  </script>
</body>
</html>
